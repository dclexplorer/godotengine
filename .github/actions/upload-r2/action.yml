name: Upload artifact to R2
description: Upload build artifacts to Cloudflare R2 storage.

inputs:
  name:
    description: The artifact name (will be used as the folder name in R2).
    required: true
  path:
    description: The path to upload.
    required: true
    default: "bin/*"
  R2_ACCESS_KEY_ID:
    description: R2 access key ID
    required: true
  R2_SECRET_ACCESS_KEY:
    description: R2 secret access key
    required: true
  R2_ENDPOINT:
    description: R2 endpoint URL
    required: true
  R2_BUCKET:
    description: R2 bucket name
    required: true
  run-id:
    description: GitHub run ID for organizing artifacts
    required: true
    default: ${{ github.run_id }}

runs:
  using: composite
  steps:
    - name: Configure AWS CLI for R2
      shell: bash
      run: |
        aws configure set aws_access_key_id ${{ inputs.R2_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ inputs.R2_SECRET_ACCESS_KEY }}
        aws configure set region auto

    - name: Upload to R2
      shell: bash
      env:
        R2_ENDPOINT: ${{ inputs.R2_ENDPOINT }}
        R2_BUCKET: ${{ inputs.R2_BUCKET }}
      run: |
        # Create the R2 path: artifacts/{run-id}/{artifact-name}/
        R2_PATH="artifacts/${{ inputs.run-id }}/${{ inputs.name }}/"

        echo "Uploading ${{ inputs.path }} to s3://${R2_BUCKET}/${R2_PATH}"

        # Upload all files from the specified path
        aws s3 cp ${{ inputs.path }} "s3://${R2_BUCKET}/${R2_PATH}" \
          --recursive \
          --endpoint-url "${R2_ENDPOINT}"

        echo "✓ Successfully uploaded ${{ inputs.name }} to R2"
        echo "Location: s3://${R2_BUCKET}/${R2_PATH}"
